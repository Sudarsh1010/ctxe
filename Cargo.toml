[package]
name = "ctxe"
version = "0.1.0"
edition = "2024"

[lib]
name = "ctxe"
path = "./src/lib.rs"

[[bin]]
name = "ctxe-cli"
path = "./src/bin/ctxe-cli.rs"

[[bin]]
name = "ctxe-mcp"
path = "./src/bin/ctxe-mcp.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tree-sitter = "0.26.6"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tiktoken-rs = "0.9.1"
git2 = "0.20.4"
thiserror = "2.0.18"
anyhow = "1.0.69"
dirs = "6.0"
walkdir = "2.5.0"
candle-core = "0.9.2"
candle-transformers = "0.9.2"
rmcp = { version = "0.17.0", features = ["server"] }
tower-lsp = "0.20.0"
