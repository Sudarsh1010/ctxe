[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Core deps
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
rusqlite = { version = "0.38.0", features = ["bundled"] }
sqlite-vec = "0.1.7-alpha.10"
sha2 = "0.11.0-rc.5"
dirs = "6.0.0"
hex = "0.4.3"
tree-sitter = "0.26.6"

# Tree-sitter language parsers (24 languages)
tree-sitter-agda = "1.3.3"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-css = "0.25.0"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-jsdoc = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-ocaml = "0.24.2"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-verilog = "1.0.3"

# File walking and parallelism
ignore = "0.4"
rayon = "1.10"

# Dev dependencies
tempfile = "3.12"

[workspace.lints.rust]
# Allow unsafe in store module for sqlite extension loading
# unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
