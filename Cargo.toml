[package]
name = "ctxe"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "ctxe"
path = "./src/lib.rs"

[[bin]]
name = "ctxe-mcp"
path = "./src/bin/ctxe-mcp/main.rs"

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
rusqlite = { version = "0.38.0", features = ["bundled"] }
sqlite-vec = "0.1.7-alpha.10"
sha2 = "0.11.0-rc.5"
dirs = "6.0.0"
hex = "0.4.3"
